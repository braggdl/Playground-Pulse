<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground Pulse - Profile</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <style>
    body.protected-pending {
      visibility: hidden;
    }
  </style>
</head>
<body class="protected-pending">
  <header class="app-header">
    <h1>Playground Pulse</h1>
    <nav class="app-nav">
      <a href="./dashboard.html" class="nav-link">Dashboard</a>
      <a href="./profile.html" class="nav-link active">Profile</a>
      <button id="logout-btn" class="btn btn-secondary">Logout</button>
    </nav>
  </header>

  <main class="profile-container">
    <section class="profile-card">
      <h2>User Profile</h2>

      <div class="profile-field">
        <label>Display Name:</label>
        <p id="profile-display-name">Loading...</p>
      </div>

      <div class="profile-field">
        <label>Email:</label>
        <p id="profile-email">Loading...</p>
      </div>

      <div class="profile-field">
        <label>Account Type:</label>
        <p id="profile-role" class="role-badge">Loading...</p>
      </div>

      <div class="profile-field">
        <label>Member Since:</label>
        <p id="profile-created-at">Loading...</p>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp, appState } from "../controllers/appController.js";
    
    // Initialize app
    initializeApp();

    // Display user profile info when ready
    const checkAuthReady = setInterval(() => {
      if (appState.authReady && appState.currentUser) {
        clearInterval(checkAuthReady);
        
        document.getElementById("profile-display-name").textContent = 
          appState.currentUser.displayName || appState.currentUser.email;
        
        document.getElementById("profile-email").textContent = 
          appState.currentUser.email;
        
        document.getElementById("profile-role").textContent = 
          appState.userRole || "Loading...";
        
        // Note: Member since would come from Firestore user record in Phase 3+
        document.getElementById("profile-created-at").textContent = 
          appState.currentUser.metadata?.creationTime || "Account created";
      }
    }, 100);
  </script>
</body>
</html>
