<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground Pulse - Home</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body class="home-page" data-colors-mode="light">
  <main class="home-shell">
    <section class="home-artboard" aria-label="Playground Pulse homepage illustration">
      <img
        class="home-artwork"
        src="../development/Figma%20Files/PlaygroundPulseDesktop%20-%204.svg"
        alt="Playground Pulse home design"
      />

      <div class="home-ball-zone" aria-hidden="true">
        <img
          class="home-ball"
          src="../development/Figma%20Files/Ball.svg"
          alt=""
        />
      </div>

      <form id="home-search-form" class="home-search-overlay" role="search">
        <label class="home-search-label" for="home-search-input">Search parks by name or location</label>
        <input
          type="text"
          id="home-search-input"
          class="home-search-input"
          placeholder="Search parks by name or location"
          autocomplete="off"
          required
        />
      </form>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "../controllers/appController.js";

    initializeApp();

    const searchForm = document.getElementById("home-search-form");
    const searchInput = document.getElementById("home-search-input");
    const ball = document.querySelector(".home-ball");
    let isBallAnimating = false;
    let ballAnimationTimer;

    const getBallAnimationDurationMs = () => {
      if (!ball) {
        return 0;
      }

      const duration = window.getComputedStyle(ball).animationDuration.split(",")[0].trim();
      if (duration.endsWith("ms")) {
        return Number.parseFloat(duration);
      }

      if (duration.endsWith("s")) {
        return Number.parseFloat(duration) * 1000;
      }

      return 0;
    };

    if (searchForm && searchInput) {
      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const searchTerm = searchInput.value.trim();
        if (!searchTerm) {
          return;
        }

        window.location.href = `./dashboard.html?q=${encodeURIComponent(searchTerm)}`;
      });
    }

    if (ball) {
      const startBallAnimation = () => {
        if (isBallAnimating) {
          return;
        }

        isBallAnimating = true;
        ball.classList.remove("home-ball-animate");
        // Force reflow so the one-shot class always restarts from frame 0.
        void ball.offsetWidth;
        ball.classList.add("home-ball-animate");

        const ballAnimationMs = getBallAnimationDurationMs();
        clearTimeout(ballAnimationTimer);
        ballAnimationTimer = setTimeout(() => {
          isBallAnimating = false;
          ball.classList.remove("home-ball-animate");
        }, ballAnimationMs + 80);
      };

      ball.addEventListener("pointerenter", startBallAnimation);

      ball.addEventListener("animationend", () => {
        clearTimeout(ballAnimationTimer);
        isBallAnimating = false;
        ball.classList.remove("home-ball-animate");
      });
    }
  </script>
</body>
</html>
