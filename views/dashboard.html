<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground Pulse - Dashboard</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
    defer
  ></script>
  <style>
    body.protected-pending {
      visibility: hidden;
    }
  </style>
</head>
<body class="protected-pending">
  <header class="app-header">
    <h1>Playground Pulse Dashboard</h1>
    <nav class="app-nav">
      <a href="./dashboard.html" class="nav-link active">Dashboard</a>
      <a href="./profile.html" class="nav-link">Profile</a>
      <a href="./admin.html" id="nav-admin-link" class="nav-link" style="display: none;">Admin</a>
      <button id="logout-btn" class="btn btn-secondary">Logout</button>
    </nav>
  </header>

  <main class="dashboard-container">
    <div id="welcome-popup-overlay"></div>
    <div class="notification-section">
      <button id="admin-notifications-toggle-btn" type="button" class="btn btn-secondary notification-toggle" style="display: none;">
        Notifications
        <span id="admin-notification-unread-count" class="badge badge-unread" style="display: none;">0</span>
      </button>
      <div id="notification-panel-container" class="notification-panel-container"></div>
    </div>

    <section class="dashboard-content">
      <h2>Find Playgrounds</h2>

      <div class="park-management-controls">
        <button id="create-park-btn" class="btn btn-primary" style="display: none;">Create Park</button>
        <button id="toggle-map-view-btn" class="btn btn-secondary" style="display: none;">Map View</button>
      </div>

      <!-- Phase 3: Search and Filter Section -->
      <div class="search-filter-section">
        
        <!-- Search Input -->
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search parks by name or location..."
            autocomplete="off"
          />
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
          <h3>Filter By:</h3>
          
          <!-- Age Groups -->
          <fieldset class="filter-group">
            <legend>Age Groups</legend>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-age-toddler" />
              <span>Toddler (0-2)</span>
            </label>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-age-kid" />
              <span>Kid (3-12)</span>
            </label>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-age-teen" />
              <span>Teen (13+)</span>
            </label>
          </fieldset>

          <!-- Amenities -->
          <fieldset class="filter-group">
            <legend>Amenities</legend>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-fenced" />
              <span>Fenced Area</span>
            </label>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-restrooms" />
              <span>Restrooms</span>
            </label>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-shade" />
              <span>Shade Available</span>
            </label>
          </fieldset>

          <!-- Maintenance Status -->
          <fieldset class="filter-group">
            <legend>Maintenance Status</legend>
            <select id="filter-maintenance" class="filter-select">
              <option value="">Any Status</option>
              <option value="good">Good</option>
              <option value="needs_attention">Needs Attention</option>
              <option value="closed">Closed</option>
              <option value="unknown">Unknown</option>
            </select>
          </fieldset>

          <!-- Clear Filters Button -->
          <button id="clear-filters-btn" class="btn btn-secondary filter-btn">Clear Filters</button>
        </div>
      </div>

      <!-- Park Results Section -->
      <div class="results-section">
        <div id="park-results-container" class="park-results-container">
          <!-- Results or state messages rendered here -->
        </div>

        <!-- Park Detail Section -->
        <div id="park-detail-container" class="park-detail-container">
          <!-- Park detail view rendered here when a park is selected -->
        </div>

        <div id="crowd-report-container" class="crowd-report-container">
          <!-- Crowd report controls rendered here for authenticated users with a selected park -->
        </div>

        <div id="safety-report-container" class="safety-report-container">
          <!-- Safety report form and report list are rendered here -->
        </div>

        <div id="equipment-panel-container" class="equipment-panel-container">
          <!-- Equipment management panel is rendered here -->
        </div>

        <div id="crowd-history-container" class="crowd-history-container">
          <!-- Crowd history timeline is rendered here -->
        </div>

        <div id="park-map-container" class="park-map-container" style="display: none;">
          <!-- Leaflet map view is rendered here -->
        </div>

        <div id="park-form-container" class="park-form-container">
          <!-- Create/edit park form rendered here for authorized roles -->
        </div>
      </div>

    </section>
  </main>

  <script type="module">
    import { initializeApp } from "../controllers/appController.js";
    import { handleLogout } from "../controllers/authController.js";
    
    // Initialize app
    initializeApp();

    // Wire logout button
    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", handleLogout);
    }
  </script>
</body>
</html>
