<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground Pulse - Dashboard</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
    defer
  ></script>
  <style>
    body.protected-pending {
      visibility: hidden;
    }
  </style>
</head>
<body class="protected-pending app-shell-page dashboard-page">
  <div class="dashboard-cloud-layer" aria-hidden="true">
    <img class="dashboard-cloud cloud-a" src="../development/Figma%20Files/Cloud.svg" alt="" />
    <img class="dashboard-cloud cloud-b" src="../development/Figma%20Files/Cloud.svg" alt="" />
    <img class="dashboard-cloud cloud-c" src="../development/Figma%20Files/Cloud.svg" alt="" />
    <img class="dashboard-cloud cloud-d" src="../development/Figma%20Files/Cloud.svg" alt="" />
    <img class="dashboard-cloud cloud-e" src="../development/Figma%20Files/Cloud.svg" alt="" />
    <img class="dashboard-cloud cloud-f" src="../development/Figma%20Files/Cloud.svg" alt="" />
  </div>

  <header class="app-header">
    <h1>Playground Pulse Dashboard</h1>
    <nav class="app-nav">
      <a href="./dashboard.html" class="nav-link active">Dashboard</a>
      <a href="./about.html" class="nav-link">About</a>
      <a href="./profile.html" class="nav-link">Profile</a>
      <a href="./admin.html" id="nav-admin-link" class="nav-link" style="display: none;">Admin</a>
      <button id="logout-btn" class="btn btn-secondary">Logout</button>
    </nav>
  </header>

  <main class="dashboard-container">
    <div id="welcome-popup-overlay"></div>
    <div class="notification-section">
      <button id="admin-notifications-toggle-btn" type="button" class="btn btn-secondary notification-toggle" style="display: none;">
        Notifications
        <span id="admin-notification-unread-count" class="badge badge-unread" style="display: none;">0</span>
      </button>
      <div id="notification-panel-container" class="notification-panel-container"></div>
    </div>

    <section class="page-intro card">
      <p class="eyebrow">Park discovery</p>
      <h2>Find Playgrounds</h2>
      <p class="page-intro-copy">Search by name or location, then narrow the results to parks that feel right for your children, routines, and comfort level.</p>
    </section>

    <section class="dashboard-content">
      <div class="park-management-controls">
        <button id="create-park-btn" class="btn btn-primary" style="display: none;">Create Park</button>
        <button id="toggle-map-view-btn" class="btn btn-secondary" style="display: none;">Map View</button>
      </div>

      <!-- Phase 3: Search and Filter Section -->
      <div class="search-filter-section">
        
        <!-- Search Input -->
        <div class="search-box">
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search parks by name or location..."
            autocomplete="off"
          />
        </div>

        <!-- Filter Controls -->
        <div class="filter-controls">
          <h3>Filter By:</h3>
          
          <!-- Age Groups -->
          <fieldset class="filter-group">
            <legend>Age Groups</legend>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-age-toddler" />
              <span>Toddler (0-2)</span>
            </label>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-age-kid" />
              <span>Kid (3-12)</span>
            </label>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-age-teen" />
              <span>Teen (13+)</span>
            </label>
          </fieldset>

          <!-- Amenities -->
          <fieldset class="filter-group">
            <legend>Amenities</legend>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-fenced" />
              <span>Fenced Area</span>
            </label>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-restrooms" />
              <span>Restrooms</span>
            </label>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-shade" />
              <span>Shade Available</span>
            </label>
          </fieldset>

          <!-- Maintenance Status -->
          <fieldset class="filter-group">
            <legend>Maintenance Status</legend>
            <select id="filter-maintenance" class="filter-select">
              <option value="">Any Status</option>
              <option value="good">Good</option>
              <option value="needs_attention">Needs Attention</option>
              <option value="closed">Closed</option>
              <option value="unknown">Unknown</option>
            </select>
          </fieldset>

          <!-- Clear Filters Button -->
          <button id="clear-filters-btn" class="btn btn-secondary filter-btn">Clear Filters</button>
        </div>
      </div>

      <!-- Park Results Section -->
      <div class="results-section">
        <div id="park-results-container" class="park-results-container">
          <!-- Results or state messages rendered here -->
        </div>

        <!-- Park Detail Section -->
        <div id="park-detail-container" class="park-detail-container">
          <!-- Park detail view rendered here when a park is selected -->
        </div>

        <div id="crowd-report-container" class="crowd-report-container">
          <!-- Crowd report controls rendered here for authenticated users with a selected park -->
        </div>

        <div id="safety-report-container" class="safety-report-container">
          <!-- Safety report form and report list are rendered here -->
        </div>

        <div id="equipment-panel-container" class="equipment-panel-container">
          <!-- Equipment management panel is rendered here -->
        </div>

        <div id="crowd-history-container" class="crowd-history-container">
          <!-- Crowd history timeline is rendered here -->
        </div>

        <div id="park-map-container" class="park-map-container" style="display: none;">
          <!-- Leaflet map view is rendered here -->
        </div>

        <div id="park-form-container" class="park-form-container">
          <!-- Create/edit park form rendered here for authorized roles -->
        </div>
      </div>

      <div id="dashboard-park-modal" class="dashboard-park-modal" aria-hidden="true">
        <div class="dashboard-park-modal-backdrop" onclick="window.appControllerExports.closeDashboardParkModal()"></div>
        <section class="dashboard-park-modal-content" role="dialog" aria-modal="true" aria-label="Park details">
          <button type="button" class="dashboard-park-modal-close" onclick="window.appControllerExports.closeDashboardParkModal()" aria-label="Close park details">x</button>
          <div id="park-detail-modal-container" class="park-detail-container"></div>
          <div id="crowd-report-modal-container" class="crowd-report-container"></div>
          <div id="park-form-modal-container" class="park-form-container"></div>
        </section>
      </div>

      <div id="park-action-modal" class="park-action-modal" aria-hidden="true">
        <div class="park-action-modal-backdrop" onclick="window.appControllerExports.closeParkActionModal()"></div>
        <section class="park-action-modal-content" role="dialog" aria-modal="true" aria-label="Park action details">
          <button type="button" class="park-action-modal-close" onclick="window.appControllerExports.closeParkActionModal()" aria-label="Close action details">x</button>
          <div id="park-action-modal-content"></div>
        </section>
      </div>

    </section>
  </main>

  <section class="dashboard-trees-footer" aria-hidden="true">
    <img src="../development/Figma%20Files/Trees%20only.svg" alt="" />
  </section>

  <div class="dashboard-butterfly-layer" aria-hidden="true">
    <img id="dashboard-butterfly" src="../development/Figma%20Files/Butterfly.svg" alt="" />
  </div>

  <script type="module">
    import { initializeApp } from "../controllers/appController.js";
    
    // Initialize app
    initializeApp();

    const butterfly = document.getElementById("dashboard-butterfly");
    const butterflyLayer = document.querySelector(".dashboard-butterfly-layer");

    function initButterflyFollower() {
      if (!butterfly || !butterflyLayer) {
        return;
      }

      const MAX_BUTTERFLIES = 6;
      const MAX_FOLLOWERS = MAX_BUTTERFLIES - 1;
      const SPAWN_INTERVAL_MS = 6000;
      const TRAIL_MAX_POINTS = 720;
      const FOLLOWER_TRAIL_GAP = 16;
      const MOTION_BOUNDS = {
        left: 24,
        right: 24,
        top: -14,
        bottom: 24
      };
      const butterflySprites = [
        "../development/Figma%20Files/Butterfly.svg",
        "../development/Figma%20Files/Butterfly%202.svg"
      ];

      const followers = [];
      const trailHistory = [];

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const getMotionBounds = () => ({
        minX: MOTION_BOUNDS.left,
        maxX: window.innerWidth - MOTION_BOUNDS.right,
        minY: MOTION_BOUNDS.top,
        maxY: window.innerHeight - MOTION_BOUNDS.bottom
      });

      const state = {
        x: window.innerWidth * 0.5,
        y: window.innerHeight - 80,
        targetX: window.innerWidth * 0.5,
        targetY: window.innerHeight - 80,
        lastTrailTime: 0
      };

      function spawnFollower() {
        if (followers.length >= MAX_FOLLOWERS) {
          return;
        }

        const follower = document.createElement("img");
        follower.className = "dashboard-butterfly-follower";
        follower.src = butterflySprites[(followers.length + 1) % butterflySprites.length];
        follower.alt = "";

        const scale = 0.8 + Math.random() * 0.28;
        follower.style.setProperty("--butterfly-scale", String(scale));

        const followerState = {
          el: follower,
          x: state.x - 14 * (followers.length + 1),
          y: state.y + 10,
          angle: 0
        };

        followers.push(followerState);
        butterflyLayer.appendChild(follower);
      }

      const render = () => {
        const dx = state.targetX - state.x;
        const dy = state.targetY - state.y;
        state.x += dx * 0.14;
        state.y += dy * 0.14;

        trailHistory.unshift({ x: state.x, y: state.y });
        if (trailHistory.length > TRAIL_MAX_POINTS) {
          trailHistory.length = TRAIL_MAX_POINTS;
        }

        const angle = Math.max(-22, Math.min(22, dx * 0.12));
        butterfly.style.transform = `translate3d(${state.x}px, ${state.y}px, 0) rotate(${angle}deg)`;

        followers.forEach((follower, index) => {
          const trailIndex = Math.min(trailHistory.length - 1, (index + 1) * FOLLOWER_TRAIL_GAP);
          const target = trailHistory[trailIndex] || { x: state.x, y: state.y };
          const fdx = target.x - follower.x;
          const fdy = target.y - follower.y;

          follower.x += fdx * 0.13;
          follower.y += fdy * 0.13;
          follower.angle = Math.max(-26, Math.min(26, fdx * 0.14));
          follower.el.style.transform = `translate3d(${follower.x}px, ${follower.y}px, 0) rotate(${follower.angle}deg) scale(var(--butterfly-scale))`;
        });

        const now = performance.now();
        if (now - state.lastTrailTime > 35) {
          spawnTrail(state.x, state.y);
          state.lastTrailTime = now;
        }

        requestAnimationFrame(render);
      };

      const spawnTrail = (x, y) => {
        const dot = document.createElement("span");
        dot.className = "butterfly-trail-dot";
        dot.style.left = `${x}px`;
        dot.style.top = `${y}px`;
        butterflyLayer.appendChild(dot);
        dot.addEventListener("animationend", () => {
          dot.remove();
        }, { once: true });
      };

      window.addEventListener("mousemove", (event) => {
        const bounds = getMotionBounds();
        state.targetX = clamp(event.clientX, bounds.minX, bounds.maxX);
        state.targetY = clamp(event.clientY, bounds.minY, bounds.maxY);
      });

      window.addEventListener("resize", () => {
        const bounds = getMotionBounds();

        state.targetX = clamp(state.targetX, bounds.minX, bounds.maxX);
        state.targetY = clamp(state.targetY, bounds.minY, bounds.maxY);
        state.x = clamp(state.x, bounds.minX, bounds.maxX);
        state.y = clamp(state.y, bounds.minY, bounds.maxY);

        followers.forEach((follower) => {
          follower.x = clamp(follower.x, bounds.minX, bounds.maxX);
          follower.y = clamp(follower.y, bounds.minY, bounds.maxY);
        });
      });

      butterfly.style.transform = `translate3d(${state.x}px, ${state.y}px, 0)`;
      window.setInterval(spawnFollower, SPAWN_INTERVAL_MS);
      requestAnimationFrame(render);
    }

    initButterflyFollower();
  </script>
</body>
</html>
