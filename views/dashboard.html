<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground Pulse - Dashboard</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <header class="app-header">
    <h1>Playground Pulse Dashboard</h1>
    <nav class="app-nav">
      <a href="./dashboard.html" class="nav-link active">Dashboard</a>
      <a href="./profile.html" class="nav-link">Profile</a>
      <button id="logout-btn" class="btn btn-secondary">Logout</button>
    </nav>
  </header>

  <main class="dashboard-container">
    <div class="user-info-section">
      <h2>Welcome, <span id="user-display-name">User</span>!</h2>
      <p>Role: <span id="user-role" class="role-badge">Parent</span></p>
    </div>

    <section class="dashboard-content">
      <h2>Dashboard</h2>
      <p>This is a placeholder for the authenticated user dashboard.</p>
      <!-- Park lists, search, filters, and status updates will be added in Phase 3 -->
    </section>
  </main>

  <script type="module">
    import { initializeApp, appState } from "../controllers/appController.js";
    
    // Initialize app
    initializeApp();

    // Display user info when ready
    const checkAuthReady = setInterval(() => {
      if (appState.authReady) {
        clearInterval(checkAuthReady);
        if (appState.currentUser) {
          document.getElementById("user-display-name").textContent = appState.currentUser.displayName || appState.currentUser.email;
        }
        if (appState.userRole) {
          document.getElementById("user-role").textContent = appState.userRole;
        }
      }
    }, 100);
  </script>
</body>
</html>
