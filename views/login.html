<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground Pulse - Login</title>
  <link rel="stylesheet" href="../styles/main.css" />
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <h1>Playground Pulse</h1>

      <!-- Error Message Container -->
      <div id="auth-error-message" class="error-message" style="display: none;"></div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" style="display: block;">
        <h2>Sign In</h2>

        <div class="form-group">
          <label for="login-email">Email:</label>
          <input
            type="email"
            id="login-email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="login-password">Password:</label>
          <input
            type="password"
            id="login-password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="button" id="login-btn" class="btn btn-primary">
          Login
        </button>

        <p class="auth-toggle">
          Don't have an account?
          <a id="toggle-auth-mode-login" href="#" class="toggle-link">Register here</a>
        </p>

        <p class="forgot-password-link">
          <a id="forgot-password-link" href="#" class="toggle-link">Forgot password?</a>
        </p>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form" style="display: none;">
        <h2>Create Account</h2>

        <div class="form-group">
          <label for="register-display-name">Display Name:</label>
          <input
            type="text"
            id="register-display-name"
            placeholder="Enter your name"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-email">Email:</label>
          <input
            type="email"
            id="register-email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-password">Password:</label>
          <input
            type="password"
            id="register-password"
            placeholder="Enter password (min 6 characters)"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-confirm-password">Confirm Password:</label>
          <input
            type="password"
            id="register-confirm-password"
            placeholder="Confirm password"
            required
          />
        </div>

        <div class="form-group">
          <label for="register-role">Account Type:</label>
          <select id="register-role">
            <option value="Parent">Parent</option>
            <option value="Park Admin">Park Admin</option>
            <option value="Site Admin">Site Admin</option>
          </select>
        </div>

        <button type="button" id="register-btn" class="btn btn-primary">
          Register
        </button>

        <p class="auth-toggle">
          Already have an account?
          <a id="toggle-auth-mode-register" href="#" class="toggle-link">Sign in here</a>
        </p>
      </form>

      <!-- Forgot Password Modal -->
      <div id="forgot-password-modal" class="modal" style="display: none;">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Reset Password</h2>
            <button type="button" id="close-forgot-modal-btn" class="close-button" aria-label="Close modal">×</button>
          </div>
          <div class="modal-body">
            <p>Enter your email address and we'll send you a link to reset your password.</p>
            <div class="form-group">
              <label for="forgot-email">Email:</label>
              <input
                type="email"
                id="forgot-email"
                placeholder="Enter your email"
                required
              />
            </div>
            <div id="forgot-password-message" class="forgot-password-message" style="display: none;"></div>
          </div>
          <div class="modal-footer">
            <button type="button" id="send-reset-btn" class="btn btn-primary">
              Send Reset Email
            </button>
            <button type="button" id="back-to-login-link" class="btn btn-secondary">
              Back to Login
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "../controllers/appController.js";
    initializeApp();
  </script>
</body>
</html>
