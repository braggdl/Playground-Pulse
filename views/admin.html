<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground Pulse - Admin</title>
  <link rel="stylesheet" href="../styles/main.css" />
  <style>
    body.protected-pending {
      visibility: hidden;
    }
  </style>
</head>
<body class="protected-pending">
  <header class="app-header">
    <h1>Playground Pulse Administration</h1>
    <nav class="app-nav">
      <a href="./dashboard.html" class="nav-link">Dashboard</a>
      <a href="./profile.html" class="nav-link">Profile</a>
      <a href="./admin.html" class="nav-link active">Admin</a>
      <button id="logout-btn" class="btn btn-secondary">Logout</button>
    </nav>
  </header>

  <main class="dashboard-container">
    <div class="user-info-section">
      <h2>Admin Workspace</h2>
      <p>User: <span id="admin-user-display">Loading...</span></p>
      <p>Role: <span id="admin-user-role" class="role-badge">Loading...</span></p>
    </div>

    <section class="dashboard-content admin-workspace">
      <section class="card admin-panel admin-notifications-section">
        <button id="admin-notifications-toggle-btn" type="button" class="btn btn-secondary notification-toggle" style="display: none;">
          Notifications
          <span id="admin-notification-unread-count" class="badge badge-unread" style="display: none;">0</span>
        </button>
        <div id="notification-panel-container" class="notification-panel-container"></div>
      </section>

      <h2>Safety and Maintenance Management</h2>
      <p class="admin-note">This view implements Sprint 3 Workstream 1 management surfaces for safety reports and equipment status only.</p>

      <div id="admin-workstream1-container" class="admin-panel-grid">
        <section id="admin-safety-panel" class="card admin-panel">
          <!-- Safety report management rendered by appController -->
        </section>

        <section id="admin-equipment-panel" class="card admin-panel">
          <!-- Equipment management rendered by appController -->
        </section>
      </div>

      <section id="admin-workstream1-status" class="card admin-panel">
        <!-- Status and permission messages rendered by appController -->
      </section>
    </section>
  </main>

  <script type="module">
    import { initializeApp, appState } from "../controllers/appController.js";
    import { handleLogout } from "../controllers/authController.js";

    initializeApp();

    const roleElement = document.getElementById("admin-user-role");
    const userElement = document.getElementById("admin-user-display");

    const checkAuthReady = setInterval(() => {
      if (!appState.authReady) {
        return;
      }

      clearInterval(checkAuthReady);

      const currentUser = appState.currentUser;
      const role = appState.userRole || "Parent";

      if (roleElement) {
        roleElement.textContent = role;
      }

      if (userElement) {
        userElement.textContent = currentUser?.displayName || currentUser?.email || "Unknown";
      }
    }, 100);

    const logoutBtn = document.getElementById("logout-btn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", handleLogout);
    }
  </script>
</body>
</html>
