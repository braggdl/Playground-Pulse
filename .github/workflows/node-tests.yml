name: Run Node Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the Cloud Functions runtime declared in functions/package.json
          node-version: '22'

      - name: Run tests
        run: node tests.js

      - name: Syntax-check Cloud Functions
        run: node --check index.js
        working-directory: functions
